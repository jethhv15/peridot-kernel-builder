name: Build Peridot 6.1.176 Kernel

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Builder Repo
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git \
            libssl-dev libelf-dev dwarves python3 zstd lz4 zip unzip

      - name: Fetch AOSP GKI 6.1 Clang Toolchain
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android14-release clang-prebuilts
          CLANG_DIR=$(ls -d clang-prebuilts/clang-r* | sort -V | tail -n 1)
          echo "CLANG_PATH=$GITHUB_WORKSPACE/$CLANG_DIR/bin" >> $GITHUB_ENV

      - name: Clone AOSP GKI 6.1.176 Source
        run: |
          git clone --depth=250 https://android.googlesource.com/kernel/common -b android14-6.1-lts kernel
          cd kernel
          COMMIT_176=$(git log --grep="6.1.176" --format="%H" | tail -n 1)
          if [ -n "$COMMIT_176" ]; then
            git checkout "$COMMIT_176"
          fi
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
          sed -i 's/char \*next_path;/const char *next_path;/g' tools/lib/bpf/libbpf.c || true
          sed -i -E 's/-Werror([^=]|$)/\1/g' tools/lib/bpf/Makefile tools/bpf/resolve_btfids/Makefile || true
          sed -i '/#include "kasan.h"/a #ifndef CONFIG_KASAN_HW_TAGS\nstatic inline void hw_suppress_tag_checks_start(void) {}\nstatic inline void hw_suppress_tag_checks_stop(void) {}\n#endif' mm/kasan/report.c
          for p in "$GITHUB_WORKSPACE"/patches/*.patch; do
            if [ -f "$p" ]; then
              git apply "$p"
            fi
          done

      - name: Configure and Compile Kernel
        run: |
          export PATH="$CLANG_PATH:$PATH"
          cd kernel
          mkdir -p out
          rm -f localversion*
          cp "$GITHUB_WORKSPACE/config/base.config" out/.config
          ./scripts/kconfig/merge_config.sh -m -O out out/.config "$GITHUB_WORKSPACE/config/peridot_perf.fragment"
          ARCH=arm64 LLVM=1 LLVM_IAS=1 make O=out olddefconfig
          rm -f out/.scmversion
          ARCH=arm64 LLVM=1 LLVM_IAS=1 make -j$(nproc --all) O=out \
            HOSTCC="clang -std=gnu11 -Wno-error" \
            HOSTCFLAGS="-std=gnu11 -Wno-error" \
            KCFLAGS="-Wno-error" \
            Image
          echo "Built kernel release: $(cat out/include/config/kernel.release)"

      - name: Package AnyKernel3 Zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          rm -rf ak3/.git ak3/modules ak3/patch ak3/ramdisk
          cp "$GITHUB_WORKSPACE/anykernel/anykernel.sh" ak3/anykernel.sh
          cp kernel/out/arch/arm64/boot/Image ak3/Image
          cd ak3
          zip -r9 "$GITHUB_WORKSPACE/Peridot-6.1.176-Jethh-KSU.zip" ./*

      - name: Upload Flashable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Peridot-6.1.176-Jethh-KSU
          path: Peridot-6.1.176-Jethh-KSU.zip
